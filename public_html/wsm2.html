<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>WikiShootMe</title>

<!-- Bootstrap -->
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
>

<!-- Leaflet 1.9.4 -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>
#geomessage {
    color: #BBB;
    font-size: 8pt;
    display: block !important;
}

td.num {
    font-family: Courier, monospace;
    font-size: 10pt;
    text-align: right;
    width: 80px;
}

div.loading {
    float: right;
    margin-left: 5px;
    padding: 3px;
    background-color: red;
    color: white;
}

.ended {
    border-right: 15px solid red;
}

#map {
    width: 100%;
    height: 512px;
    margin-top: 20px;
}
</style>
</head>

<body>

<nav class="navbar navbar-default" role="navigation">
    <div class="container-fluid">
        <div class="navbar-header">
            <a class="navbar-brand" href="#">WikiShootMe</a>
        </div>

        <div id="navbar" class="navbar-collapse collapse">
            <ul class="nav navbar-nav navbar-right">
                <li>
                    <div id="interface_language_wrapper"></div>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">

    <div class="lead">
        Find Wikidata items near a location that don't have images.
    </div>

    <div>
        <form id="main_form" class="form-inline" role="form">

            <table class="table">
                <tbody>

                <tr>
                    <th>Coordinates</th>
                    <td>
                        <div style="display:block">
                            <input
                                id="lat"
                                type="text"
                                placeholder="Latitude"
                                class="input-sm col-md-2 col-xs-4 col-sm-2"
                            >

                            <input
                                id="lon"
                                type="text"
                                placeholder="Longitude"
                                class="input-sm col-md-2 col-xs-4 col-sm-2"
                            >

                            , <i>or</i>
                        </div>

                        <br>
                        <div id="geomessage"></div>
                    </td>
                </tr>

                <tr>
                    <th>Wikidata item</th>
                    <td>
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">Q</div>

                                <input
                                    id="item"
                                    type="text"
                                    placeholder="Wikidata item"
                                    class="input-sm col-xs-7"
                                >
                            </div>
                        </div>

                        , <i>or</i>
                    </td>
                </tr>

                <tr>
                    <th>Wikipedia article</th>
                    <td>
                        <input
                            id="lang"
                            type="text"
                            placeholder="Language"
                            class="input-sm col-md-1 col-xs-4 col-sm-2"
                        >

                        <input
                            id="project"
                            type="text"
                            value="wikipedia"
                            placeholder="Project"
                            class="input-sm col-md-1 col-xs-6 col-sm-2"
                        >

                        <input
                            id="page"
                            type="text"
                            placeholder="Article title"
                            class="input-sm col-md-2 col-xs-10 col-sm-4"
                        >
                    </td>
                </tr>

                <tr>
                    <th>Radius</th>
                    <td>

                        <div class="form-group">
                            <div class="input-group">

                                <input
                                    id="radius"
                                    type="number"
                                    min="0.1"
                                    step="0.1"
                                    class="input-sm"
                                    style="text-align:right"
                                >

                                <div class="input-group-addon">km</div>

                            </div>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Find items without images
                        </button>

                        <a
                            id="permalink"
                            style="margin-left:50px;display:none"
                        >
                            Permalink
                        </a>

                    </td>
                </tr>

                </tbody>
            </table>

        </form>
    </div>

    <div id="results"></div>

</div>


<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/*
 * WikiShootMe
 * GitHub Pages updated version
 */

if (typeof Number.prototype.toRadians === 'undefined') {
    Number.prototype.toRadians = function () {
        return this * Math.PI / 180;
    };
}

var default_radius = 5;
var default_project = 'wikipedia';

var coords = {};
var last_data;
var map = null;

function getParameterByName(name, def) {

    if (typeof def === 'undefined') {
        def = '';
    }

    name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");

    var regexS = "[\\?&]" + name + "=([^&#]*)";
    var regex = new RegExp(regexS);

    var results = regex.exec(window.location.href);

    if (results == null) {
        return def;
    }

    return decodeURIComponent(
        results[1].replace(/\+/g, " ")
    );
}


/*
 * Get user's location
 */

function auto_coords(pos) {

    $('#lat').val(pos.coords.latitude);
    $('#lon').val(pos.coords.longitude);

    $('#geomessage').html(
        '<span class="text-success">Location detected.</span>'
    );

    if (getParameterByName('autorun') !== '') {
        run();
    }
}


function no_auto_coords(message) {

    var text = 'Unable to determine your location.';

    if (message && message.message) {
        text += ' ' + message.message;
    }

    $('#geomessage').html(
        '<span class="text-warning">' + text + '</span>'
    );

    if (getParameterByName('autorun') !== '') {
        run();
    }
}


function getCoords() {

    var lat = getParameterByName('lat');

    var lon = getParameterByName(
        'lon',
        getParameterByName('lng')
    );

    if (lat !== '' && lon !== '') {

        var pos = {
            coords: {
                latitude: lat,
                longitude: lon
            }
        };

        auto_coords(pos);

    } else if (navigator.geolocation) {

        $('#geomessage').html(
            '<span>Trying to determine your location...</span>'
        );

        navigator.geolocation.getCurrentPosition(
            auto_coords,
            no_auto_coords
        );

    } else {

        no_auto_coords();
    }
}


/*
 * Distance calculation
 */

function getDistance(lat1, lon1, lat2, lon2) {

    var R = 6371;

    var φ1 = lat1.toRadians();
    var φ2 = lat2.toRadians();

    var Δφ = (lat2 - lat1).toRadians();
    var Δλ = (lon2 - lon1).toRadians();

    var a =
        Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
        Math.cos(φ1) *
        Math.cos(φ2) *
        Math.sin(Δλ / 2) *
        Math.sin(Δλ / 2);

    var c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;
}


function isMobile() {
    return L.Browser.mobile;
}


/*
 * Google Maps route
 */

function getRouteLink(lat, lon, text) {

    if (typeof text === 'undefined') {
        text = 'Route';
    }

    var url =
        'https://www.google.com/maps/dir/?api=1' +
        '&origin=' +
        encodeURIComponent(coords.lat + ',' + coords.lon) +
        '&destination=' +
        encodeURIComponent(lat + ',' + lon);

    return (
        '<a href="' +
        url +
        '" target="_blank" rel="noopener">' +
        text +
        '</a>'
    );
}


/*
 * Wikidata description
 */

function describe(q, callback) {

    $.get(
        'https://www.wikidata.org/w/api.php',
        {
            action: 'wbgetentities',
            ids: q,
            props: 'labels|descriptions',
            languages: 'en',
            format: 'json',
            origin: '*'
        },
        function(data) {

            var entity =
                data.entities &&
                data.entities[q];

            if (!entity) {
                callback({
                    label: q,
                    result: ''
                });
                return;
            }

            var label =
                entity.labels &&
                entity.labels.en
                    ? entity.labels.en.value
                    : q;

            var description =
                entity.descriptions &&
                entity.descriptions.en
                    ? entity.descriptions.en.value
                    : '';

            callback({
                label: label,
                result: description
            });

        }
    ).fail(function() {

        callback({
            label: q,
            result: ''
        });

    });
}


/*
 * Leaflet map
 */

function showMap() {

    if (!coords.items || Object.keys(coords.items).length === 0) {
        return;
    }

    if (map !== null) {
        map.remove();
        map = null;
    }

    map = L.map('map', {
        tap: false
    });

    /*
     * OpenStreetMap tiles
     */

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 19,
            attribution:
                '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);

    var markers = [];

    $.each(coords.items, function(q, v) {

        q = 'Q' + ('' + q).replace(/\D/g, '');

        var marker =
            L.circleMarker(
                [v[0], v[1]],
                {
                    radius: 7,
                    weight: 2,
                    fillOpacity: 0.7
                }
            );

        marker.on('click', function() {

            describe(q, function(d) {

                var html =
                    '<div style="margin-bottom:5px;border-bottom:1px solid #DDD">' +
                    '<a href="https://www.wikidata.org/wiki/' +
                    q +
                    '" target="_blank" rel="noopener">' +
                    d.label +
                    '</a> (' +
                    q +
                    ')' +
                    '</div>';

                if (d.result) {
                    html +=
                        '<div>' +
                        d.result +
                        '</div>';
                }

                html +=
                    '<div style="margin-top:5px;border-top:1px solid #DDD">' +
                    'Distance: ' +
                    Math.round(v[2] * 10) / 10 +
                    ' km (' +
                    getRouteLink(v[0], v[1]) +
                    ')' +
                    '</div>';

                marker
                    .bindPopup(html)
                    .openPopup();

            });

        });

        markers.push(marker);
    });

    var fg =
        L.featureGroup(markers)
            .addTo(map);

    if (markers.length === 1) {

        map.setView(
            markers[0].getLatLng(),
            15
        );

    } else {

        map.fitBounds(
            fg.getBounds(),
            {
                padding: [20, 20]
            }
        );
    }

    setTimeout(function() {
        map.invalidateSize();
    }, 100);
}


/*
 * Find nearby Wikidata items
 */

function showItemsAroundCoord(lat, lon) {

    var radius =
        parseFloat($('#radius').val());

    if (!radius || radius <= 0) {
        radius = default_radius;
    }

    coords = {
        lat: parseFloat(lat),
        lon: parseFloat(lon),
        radius: radius,
        items: {},
        ended: {}
    };

    var sparql =
        'SELECT ?item ?itemlocation WHERE {' +
        ' SERVICE wikibase:around {' +
        ' ?item wdt:P625 ?itemlocation .' +
        ' bd:serviceParam wikibase:center "Point(' +
        lon +
        ' ' +
        lat +
        ')"^^geo:wktLiteral .' +
        ' bd:serviceParam wikibase:radius "' +
        radius +
        '" .' +
        ' }' +
        ' FILTER NOT EXISTS {' +
        ' ?item wdt:P18 ?image .' +
        ' }' +
        '}';

    var sparql_url =
        'https://query.wikidata.org/sparql';

    $('#results').html(
        '<div class="loading">Looking for items...</div>'
    );

    $.ajax({
        url: sparql_url,
        data: {
            query: sparql,
            format: 'json'
        },
        dataType: 'json',
        headers: {
            'Accept': 'application/sparql-results+json'
        }
    })

    .done(function(d) {

        var items = [];

        $.each(
            d.results.bindings,
            function(k, v) {

                var q =
                    v.item.value.replace(
                        /^.+entity\/Q/,
                        ''
                    );

                var parts =
                    v.itemlocation.value
                        .replace(
                            /^Point\((.+? .+?)\)$/,
                            '$1'
                        )
                        .split(' ');

                var itemLat =
                    parseFloat(parts[1]);

                var itemLon =
                    parseFloat(parts[0]);

                items.push(q);

                coords.items[q] = [
                    itemLat,
                    itemLon,
                    getDistance(
                        lat,
                        lon,
                        itemLat,
                        itemLon
                    )
                ];
            }
        );

        items.sort(sort_by_distance);

        var html =
            '<h2>Results</h2>';

        html +=
            '<div class="lead">' +
            items.length +
            ' items without images' +
            '</div>';

        if (items.length > 0) {

            html +=
                '<div style="max-height:500px;overflow:auto">' +
                '<table id="results_table" class="table table-condensed table-striped">' +
                '<thead>' +
                '<tr>' +
                '<th>Distance</th>' +
                '<th>Item</th>' +
                '<th>Description</th>' +
                '</tr>' +
                '</thead>' +
                '<tbody>';

            $.each(items, function(k, q) {

                var v = coords.items[q];

                var route =
                    getRouteLink(
                        v[0],
                        v[1],
                        Math.round(v[2] * 10) / 10 +
                        ' km'
                    );

                html +=
                    '<tr q="' +
                    q +
                    '">' +
                    '<td class="num">' +
                    route +
                    '</td>' +
                    '<td class="link">' +
                    '<a href="https://www.wikidata.org/wiki/Q' +
                    q +
                    '" target="_blank" rel="noopener">' +
                    'Q' +
                    q +
                    '</a>' +
                    '</td>' +
                    '<td class="autodesc">' +
                    '<i>Loading...</i>' +
                    '</td>' +
                    '</tr>';
            });

            html +=
                '</tbody>' +
                '</table>' +
                '</div>';

            html +=
                '<h2>Map</h2>' +
                '<div id="map"></div>';
        }

        $('#results').html(html);

        if (items.length > 0) {

            showMap();

            $.each(items, function(k, q) {

                describe(q, function(d) {

                    $(
                        '#results_table tr[q="' +
                        q +
                        '"] td.autodesc'
                    ).html(d.result);

                });

            });
        }

    })

    .fail(function(xhr, status, error) {

        $('#results').html(
            '<div class="alert alert-danger">' +
            '<strong>Wikidata request failed.</strong><br>' +
            error +
            '</div>'
        );
    });
}


function sort_by_distance(a, b) {

    if (coords.items[a][2] < coords.items[b][2]) {
        return -1;
    }

    if (coords.items[a][2] > coords.items[b][2]) {
        return 1;
    }

    return 0;
}


/*
 * Search by Wikidata item
 */

function showItemsAroundItem(q) {

    $.getJSON(
        'https://www.wikidata.org/w/api.php',
        {
            action: 'wbgetentities',
            ids: 'Q' + q,
            props: 'claims',
            format: 'json',
            origin: '*'
        }
    )
    .done(function(d) {

        var entity =
            d.entities &&
            d.entities['Q' + q];

        if (
            !entity ||
            !entity.claims ||
            !entity.claims.P625
        ) {
            alert(
                'This Wikidata item does not have coordinates.'
            );
            return;
        }

        var c =
            entity.claims.P625[0]
                .mainsnak
                .datavalue
                .value;

        showItemsAroundCoord(
            c.latitude,
            c.longitude
        );

    })
    .fail(function() {

        alert(
            'Unable to retrieve the Wikidata item.'
        );

    });
}


/*
 * Search by Wikipedia article
 */

function showItemsAroundPage(
    language,
    project,
    article
) {

    $.getJSON(
        'https://' +
        language +
        '.' +
        project +
        '.org/w/api.php',
        {
            action: 'query',
            prop: 'coordinates',
            titles: article,
            format: 'json',
            origin: '*'
        }
    )
    .done(function(data) {

        if (
            !data ||
            !data.query ||
            !data.query.pages
        ) {
            alert(
                'Wikipedia article not found.'
            );
            return;
        }

        var key;

        for (key in data.query.pages) {
            break;
        }

        var page =
            data.query.pages[key];

        if (
            !page ||
            !page.coordinates ||
            !page.coordinates.length
        ) {
            alert(
                'Could not determine coordinates for this article.'
            );
            return;
        }

        var lat =
            page.coordinates[0].lat;

        var lon =
            page.coordinates[0].lon;

        showItemsAroundCoord(lat, lon);

    })
    .fail(function() {

        alert(
            'Unable to contact Wikipedia.'
        );

    });
}


/*
 * Permalink
 */

function setPermalink(o) {

    o.autorun = 1;

    o.radius =
        parseFloat($('#radius').val()) ||
        default_radius;

    if (
        typeof o.project !== 'undefined' &&
        o.project === default_project
    ) {
        delete o.project;
    }

    if (o.radius === default_radius) {
        delete o.radius;
    }

    var a = [];

    $.each(o, function(k, v) {

        a.push(
            k +
            '=' +
            encodeURIComponent(v)
        );

    });

    var url =
        '?' +
        a.join('&') +
        '#map';

    $('#permalink')
        .attr('href', url)
        .show();
}


/*
 * Main search
 */

function run() {

    var q =
        $('#item')
            .val()
            .replace(/\D/g, '');

    if (q !== '') {

        setPermalink({
            item: q
        });

        showItemsAroundItem(q);
        return;
    }

    var lang =
        $('#lang')
            .val()
            .toLowerCase()
            .replace(/[^a-z-]/g, '');

    var project =
        $('#project')
            .val()
            .toLowerCase()
            .replace(/[^a-z]/g, '');

    var page =
        $('#page').val();

    if (
        lang !== '' &&
        project !== '' &&
        page !== ''
    ) {

        setPermalink({
            lang: lang,
            project: project,
            page: page.replace(/ /g, '_')
        });

        showItemsAroundPage(
            lang,
            project,
            page
        );

        return;
    }

    var lat =
        $('#lat')
            .val()
            .replace(/[^-.0-9]/g, '');

    var lon =
        $('#lon')
            .val()
            .replace(/[^-.0-9]/g, '');

    if (lat !== '' && lon !== '') {

        setPermalink({
            lat: lat,
            lon: lon
        });

        showItemsAroundCoord(
            lat,
            lon
        );

        return;
    }

    alert(
        'Please enter coordinates, a Wikidata item, or a Wikipedia article.'
    );
}


/*
 * Start application
 */

$(document).ready(function() {

    $('#radius').val(default_radius);

    $('#project').val(default_project);

    $('#main_form').on(
        'submit',
        function(e) {

            e.preventDefault();

            run();

            return false;
        }
    );

    $('#item').val(
        getParameterByName('item')
            .replace(/\D/g, '')
    );

    $('#lang').val(
        getParameterByName(
            'lang',
            getParameterByName('language')
        )
    );

    $('#project').val(
        getParameterByName(
            'project',
            default_project
        )
    );

    $('#page').val(
        getParameterByName(
            'page',
            getParameterByName('art')
        ).replace(/_/g, ' ')
    );

    $('#radius').val(
        getParameterByName(
            'radius',
            getParameterByName(
                'distance',
                default_radius
            )
        )
    );

    getCoords();
});

</script>

</body>
</html>
