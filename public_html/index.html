<div id='top'>
<nav class="d-flex align-items-center flex-nowrap gap-1 px-1">
	<button id='center_on_me' class='btn btn-light btn-sm' tt_title='go_to_my_position'><i class="fa fa-compass fa-lg" aria-hidden="true"></i></button>
	<button id='search' class='btn btn-light btn-sm' tt_title='search'>&#128269;</button>
	<span id='dropdownUploadsLi' class="dropdown">
	  <button class="btn btn-light btn-sm dropdown-toggle" type="button" id="dropdownUploads" data-bs-toggle="dropdown" aria-expanded="false"></button>
	  <div class="dropdown-menu" id='upload_list'></div>
	</span>
	<span id="geo_error" style='font-size:7pt'></span>
	<button id='clustering_toggle' class='btn btn-light btn-sm active' title='Toggle marker clustering' onclick='wikishootme.toggleClustering()'><i class="fa fa-object-group" aria-hidden="true"></i></button>
	<button id='update' class='btn btn-info btn-sm' tt='update'></button>
	<span id='busy' tt_title='updating'><span class="spinner-border spinner-border-sm" role="status"></span> <span class="d-none d-md-inline text-muted" style="font-size:12px">Loading data&hellip;</span></span>
	<span id='item_count' class='badge bg-secondary' style='display:none;font-size:10px'></span>

	<span class="ms-auto"></span>

	<span id='user_status_icon' title='' style='cursor:pointer'><i class="fa fa-lock fa-lg" style='color:#dc3545' aria-hidden="true"></i></span>

	<div class="dropdown">
	  <button class="btn btn-light btn-sm" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
	    <i class="fa fa-bars fa-lg" aria-hidden="true"></i>
	  </button>
	  <div class="dropdown-menu dropdown-menu-end">
	    <div id='user_menu_item' class='dropdown-item'></div>
	    <div class="dropdown-divider"></div>
		<div id='interface_language_wrapper' class='dropdown-item'></div>
	    <a class="dropdown-item" href="#" target='_blank' id='wdfist' tt='wdfist' tt_title='wdfist_hint'></a>
	    <a class="dropdown-item" href="#" target='_blank' id='flickr' tt='flickr' tt_title='flickr_hint'></a>
	    <a class="dropdown-item" href="#" target='_blank' id='sparql_filter_button'><span tt='sparql_filter_dialog'></span><span id='is_using_filter'>&nbsp;<i class="fa fa-check" aria-hidden="true"></i></span><span id='is_using_p31_filter' style='display:none'>&nbsp;<i class="fa fa-filter" style='color:#f90' aria-hidden="true"></i></span></a>
	    <a class="dropdown-item" href="#" target='_blank' id='upload_geojson_button'><span tt='upload_geojson_dialog'></span></a>
	    <a class="dropdown-item" href='https://meta.wikimedia.org/wiki/WikiShootMe' target='_blank' tt='about'></a>
	    <div class='dropdown-item'>
	        <label class='form-check-label'><input type='checkbox' class='form-check-input' id='dark_mode_toggle' /> Dark mode</label>
	    </div>
	    <div id='tile_wrapper' class='dropdown-item'></div>
	  </div>

<div id='map'></div>

<div id='offline_banner'>&#9888; No internet connection</div>

<div id='sparql_filter_dialog' class="modal fade">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title" tt='sparql_filter_dialog'></h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">

        <div style='margin-top:10px;margin-bottom:10px' tt='sparql_filter_desc'></div>

        <div>
        <form id='sparql_simple_form' class='form d-flex'>
        <div class="row">
        <div class="col-lg-12">
			<div class="input-group">
			<input type='text' id='sparql_filter_p31' class='form-control' tt_placeholder='ph_p31' />
			<input type='submit' class='btn btn-secondary' tt_value='use_p31' />
			</div>
		</div>
		</div>
        </form>
        </div>

        <div class="card" style='margin-top:10px'>
			<pre>SELECT ?q { /*...*/</pre>
			<textarea id='sparql_filter_query' style='width:100%' rows=5 tt_placeholder='sparql_filter_query_hint'></textarea>
			<pre>}</pre>
		</div>

		<div>
		<label><input type='checkbox' id='worldwide' value='1' /> <span tt='worldwide'></span></label>
		</div>
		<div>
		<label><input type='checkbox' id='hide_destroyed' value='1' /> <span tt='hide_destroyed'>Hide destroyed/dissolved items (P576/P582)</span></label>
		</div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" tt='close'></button>
        <button type="button" id='sparql_filter_clear' class="btn btn-danger" tt='clear_filter'></button>
        <button type="button" id='sparql_filter_use' class="btn btn-primary" tt='use_filter'></button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->


<div id='search_dialog' class="modal fade">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title" tt='search_title'></h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">

        <div>
        <form id='search_form' class='form d-flex'>
        <div class="row">
        <div class="col-lg-12">
			<div class="input-group">
			<input type='text' id='search_query' class='form-control' />
			<input type='submit' class='btn btn-primary' tt_value='search' />
			</div>
		</div>
		</div>
        </form>
        </div>

        <div class="list-group" id='search_suggestions' style='display:none'></div>

        <div class="card" id='search_results' style='display:none'>
		<ul class="list-group list-group-flush" id='search_results_list'></ul>
		</div>

      </div>
<!--      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Save changes</button>
      </div>-->
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->



<div class="modal fade" id="pleaseWaitDialog" data-bs-backdrop="static" data-bs-keyboard="false">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h4 class="modal-title" tt="performing_action"></h4>
			</div>
			<div class="modal-body">
				<div class="progress"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width:100%"></div></div>
			</div>
		</div>
	</div>
</div>


<div id='upload_geojson_dialog' class="modal fade">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title" tt='upload_geojson_dialog'></h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
      	<form class="form d-flex">
	      	<input id="geojson_file" type="file" />
  	    	<button id="load_geojson" type="button" class="btn btn-primary" tt='load' data-bs-dismiss="modal"></button>
  	    </form>
  	    <div tt="geo_json_dialog_tag"></div>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->


<div id='toast_container' class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9998"></div>

<div id='new_item_dialog' class="modal fade">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title" id='new_item_dialog_title'></h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type='text' id='new_item_label' class='form-control' />
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" tt='close'></button>
        <button type="button" id='new_item_ok' class="btn btn-primary" tt='create_item_ok'>Create</button>
      </div>
    </div>
  </div>
</div>
